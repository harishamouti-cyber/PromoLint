name = "PromoLint"
client_id = "651686b64c50cd458dfa630df85781d5"
application_url = "https://example.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[auth]
redirect_urls = [
  "https://example.com/auth/callback",
  "https://example.com/auth/shopify/callback",
  "https://example.com/api/auth/callback"
]

[access_scopes]
# Official Shopify Access Scope Configuration:
# PromoLint adheres to the principle of least privilege. Only 4 read scopes are requested:
# - read_products:  Query product titles, variants, SKUs, catalog prices, images, and inventoryItem.unitCost for margin calculations.
# - read_inventory: Query point-in-time available stock at fulfillment locations via inventoryLevel.quantities.
# - read_locations: Query active fulfillment locations for location-specific stock verification.
# - read_discounts: Query active store discount rules and combinesWith permissions for stacking conflict detection.
# Zero write scopes, zero order scopes, zero customer data scopes. PromoLint never alters merchant store data or touches PII.
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,read_inventory,read_locations,read_discounts"

[webhooks]
api_version = "2025-01"

  # Handled by: /app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  # Handled by: /app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  # Mandatory GDPR compliance webhooks
  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance/customers_data_request"
  compliance_topics = ["customers/data_request"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance/customers_redact"
  compliance_topics = ["customers/redact"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance/shop_redact"
  compliance_topics = ["shop/redact"]

